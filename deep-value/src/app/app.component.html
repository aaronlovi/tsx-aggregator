<app-header
  [sidenavOpened]="sidenavOpened"
  (toggleSidenav)="sidenavOpened = !sidenavOpened"></app-header>
<mat-sidenav-container>
  <mat-sidenav
    [opened]="sidenavOpened"
    (openedChange)="sidenavOpened = $event"
    [mode]="sidenavMode">
    <mat-nav-list (click)="onNavigate()">
      <a mat-list-item routerLink="/" routerLinkActive="active" [routerLinkActiveOptions]="{exact: true}">Home</a>
      <a mat-list-item routerLink="/companies" routerLinkActive="active" [routerLinkActiveOptions]="{exact: true}">Top Companies (14+)</a>
      <a mat-list-item routerLink="/companies/bottom" routerLinkActive="active" [routerLinkActiveOptions]="{exact: true}">Bottom Companies</a>
      <a mat-list-item routerLink="/companies/all" routerLinkActive="active" [routerLinkActiveOptions]="{exact: true}">All Companies</a>
      <a mat-list-item routerLink="/companies/missing_data" routerLinkActive="active" [routerLinkActiveOptions]="{exact: true}">Missing Data</a>
      <a mat-list-item routerLink="/dashboard" routerLinkActive="active" [routerLinkActiveOptions]="{exact: true}">Dashboard</a>
      <a mat-list-item routerLink="/system-controls" routerLinkActive="active" [routerLinkActiveOptions]="{exact: true}">System Controls</a>
    </mat-nav-list>
  </mat-sidenav>
  <mat-sidenav-content>
    <router-outlet></router-outlet>
  </mat-sidenav-content>
</mat-sidenav-container>
