syntax = "proto3";

option csharp_namespace = "tsx_aggregator.Services";

// Operations-support endpoints on tsx-aggregator, used by tsx-ops. Kept separate from StockDataService
// (the data API used by stock-market-webapi) so the operations surface can be secured or bound separately later.
service AdminService {
    // Each pausable service's state: whether it runs in this process and whether it is paused.
    rpc GetServiceStatus(GetServiceStatusRequest) returns (GetServiceStatusReply);

    // Pause or resume a pausable service. If the service runs in this process the change takes effect now;
    // otherwise it is saved and applies when the service next starts. Either way it is persisted.
    rpc SetServicePaused(SetServicePausedRequest) returns (SetServicePausedReply);

    // Queue a RawDataChanged event for listed instruments with raw data, so the Aggregator rebuilds their processed
    // reports (O1). Without execute it only reports what it would queue. Unknown symbols queue nothing.
    rpc RequeueInstruments(RequeueInstrumentsRequest) returns (RequeueInstrumentsReply);

    // Find raw reports that were merged with another report of the same year or quarter before review R31, and mark
    // the repairable ones as not current, so the next scrape inserts clean copies. Queues a rebuild for each instrument
    // that lost a report. Without execute it only reports what it would do.
    rpc RepairMergedReports(RepairMergedReportsRequest) returns (RepairMergedReportsReply);
}

message GetServiceStatusRequest {}

message ServiceStatus {
    string service_name = 1;
    bool is_running = 2;   // Enabled as a hosted service in this process (HostedServices config)
    bool is_paused = 3;    // Live state if running, otherwise the saved state it would start with
}

message GetServiceStatusReply {
    bool success = 1;
    string error_message = 2;
    repeated ServiceStatus services = 3;
}

message SetServicePausedRequest {
    string service_name = 1;
    bool paused = 2;
}

message SetServicePausedReply {
    bool success = 1;
    string error_message = 2;
    bool was_paused = 3;
    bool is_paused = 4;
    bool applied_to_running_service = 5;  // False: saved for the next start
}

message RequeueInstrumentsRequest {
    bool all = 1;                          // Every listed instrument with raw data
    repeated string instrument_symbols = 2; // Or these (case-insensitive); ignored when all is set
    bool execute = 3;                      // False: dry run
}

message RequeueInstrumentsReply {
    bool success = 1;
    string error_message = 2;
    bool executed = 3;                       // True when events were inserted
    repeated string queued_symbols = 4;      // Queued, or would be on a dry run
    repeated string already_pending_symbols = 5; // A RawDataChanged event is already waiting: not queued again
    repeated string no_raw_data_symbols = 6; // Listed but no raw reports: nothing to rebuild
    repeated string unknown_symbols = 7;     // Not a listed instrument
    bool aggregator_woken = 8;               // The Aggregator runs here and was told to check now
}

message RepairMergedReportsRequest {
    repeated string instrument_symbols = 1; // Only these (case-insensitive); empty: all
    bool execute = 2;                       // False: dry run
}

enum MergedReportFinding {
    MERGED_REPORT_FINDING_UNSPECIFIED = 0;
    WRONG_DATE = 1;       // Reset: holds the other report, which is also stored under its own date
    LEFTOVER_FIELDS = 2;  // Reset: holds fields of the other report; TMX still sends this one
    ONLY_COPY = 3;        // Left: holds the other report, which is not stored under its own date
    NOT_SENT = 4;         // Left: holds fields of the other report, and TMX has not sent this one lately
}

message MergedReport {
    string company_symbol = 1;
    string instrument_symbol = 2;
    int64 instrument_report_id = 3;
    int32 report_type = 4;
    int32 report_period_type = 5;
    string report_date = 6;       // yyyy-MM-dd, of the row
    string other_report_date = 7; // yyyy-MM-dd, of the report it was merged with
    MergedReportFinding finding = 8;
    bool reset = 9;               // Marked as not current, or would be on a dry run
}

message RepairMergedReportsReply {
    bool success = 1;
    string error_message = 2;
    bool executed = 3;                    // True when reports were reset
    repeated MergedReport reports = 4;
    repeated string not_found_symbols = 5; // Requested, but no merged report found
    bool aggregator_woken = 6;            // The Aggregator runs here and was told to check now
}
